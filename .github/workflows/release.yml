name: Release

on:
  push:
    branches: [main]
  # Manual re-run: publishes every package whose version is not on npm yet.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps each package.json but not bun.lock, so the release
  # PR would leave the lockfile behind. Commit the synced lockfile to it.
  sync-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --lockfile-only --ignore-scripts
      - name: Commit bun.lock
        run: |
          git diff --quiet bun.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): sync bun.lock" bun.lock
          git push

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: result,        path: packages/result,        build: true  }
          - { name: maybe,         path: packages/maybe,         build: true  }
          - { name: pattern,       path: packages/pattern,       build: true  }
          - { name: codemod,       path: packages/codemod,       build: false }
          - { name: eslint-plugin, path: packages/eslint-plugin, build: false }
          - { name: biome-plugin,  path: packages/biome-plugin,  build: false }
          - { name: twoslash,      path: packages/twoslash,      build: true  }
          - { name: docgen,        path: packages/docgen,        build: true  }
    steps:
      - uses: actions/checkout@v4
      # Gate on npm, not on release-please output: publishing is then
      # idempotent, and a manual run picks up any version that failed before.
      - id: gate
        working-directory: ${{ matrix.path }}
        run: |
          spec="$(jq -r '.name + "@" + .version' package.json)"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $spec: already on npm."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "spec=$spec" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.released == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # npm >= 11.5.1 is required for trusted publishing; Node 24 ships it.
      - if: steps.gate.outputs.released == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: steps.gate.outputs.released == 'true'
        run: bun install --frozen-lockfile
      # `bun run build` stages result ahead of its dependents, so every
      # package's dts step sees the .d.ts it imports. `--filter` alone runs
      # scripts in parallel and races.
      - if: steps.gate.outputs.released == 'true' && matrix.build
        name: Build TS packages
        run: bun run build
      - if: steps.gate.outputs.released == 'true' && matrix.build
        name: Verify packaging
        run: bun run check:packaging
      # bun pack rewrites workspace: / catalog: ranges to real versions;
      # npm publishes the tarball, since bun publish cannot do OIDC or
      # provenance. No NPM_TOKEN: auth is the workflow's OIDC identity.
      - if: steps.gate.outputs.released == 'true'
        name: Publish ${{ steps.gate.outputs.spec }}
        working-directory: ${{ matrix.path }}
        run: |
          bun pm pack --destination "$RUNNER_TEMP/pack" --quiet
          npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --provenance
