<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" color="currentColor" role="img" aria-label="onrails">

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Portal: open-bottom arc the track runs out of -->
    <path d="M6.545 23.388A12 12 0 1 1 25.455 23.388" stroke-width="2.4" />

    <!-- Rails converging on the vanishing point at (16, 13.5) -->
    <path d="M14.625 15.5 5 29.5" stroke-width="1.9" />
    <path d="M17.375 15.5 27 29.5" stroke-width="1.9" />
  </g>

  <!-- Sleepers, spaced and thickened in perspective -->
  <g fill="currentColor">
    <rect x="12.11" y="17.35" width="7.78" height="1.3" rx="0.65" />
    <rect x="9.36"  y="21.1"  width="13.28" height="1.8" rx="0.9" />
    <rect x="5.92"  y="25.8"  width="20.16" height="2.4" rx="1.2" />
  </g>
</svg>
